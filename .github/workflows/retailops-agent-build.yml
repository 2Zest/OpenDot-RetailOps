name: RetailOps Agent image build (AMD64)

on:
  workflow_dispatch:
    inputs:
      confirm_artifact_storage_and_public_boundary:
        description: Confirm available Artifact storage and approve publishing this runnable image as an Artifact in the public repository.
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: retailops-agent-image-amd64
  cancel-in-progress: false

env:
  SOURCE_SHA: a71185311a699db7da29dbf6b8374c7c5dadd3ae
  DOCKERFILE_BLOB: 840e53c73a152bea6927a59825d3db2d27bea8b1
  IMAGE_REF: retailops/miniclaw-agent:00f
  IMAGE_SOURCE: https://github.com/2Zest/OpenDot-RetailOps
  NODE_BASE: node:24-slim
  UV_BASE: ghcr.io/astral-sh/uv:latest
  ARTIFACT_DIR: /tmp/retailops-agent-diagnostics
  IMAGE_ARTIFACT_DIR: /tmp/retailops-agent-image

jobs:
  build-smoke-export:
    name: Build, smoke, and export linux/amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Require artifact and public visibility approval
        env:
          APPROVED: ${{ inputs.confirm_artifact_storage_and_public_boundary }}
        run: |
          if [[ "$APPROVED" != "true" ]]; then
            echo "::error::Before building, confirm Artifact capacity and public-image exposure in the workflow input."
            exit 1
          fi

      - name: Prepare evidence directory
        run: mkdir -p "$ARTIFACT_DIR" "$IMAGE_ARTIFACT_DIR"

      - name: Check out fixed source baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: a71185311a699db7da29dbf6b8374c7c5dadd3ae
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Verify source and Dockerfile blob
        working-directory: source
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          actual_dockerfile_blob="$(git rev-parse "${SOURCE_SHA}:container/Dockerfile")"
          printf 'source_sha=%s\n' "$actual_sha" | tee "$ARTIFACT_DIR/source.txt"
          printf 'dockerfile_blob=%s\n' "$actual_dockerfile_blob" | tee -a "$ARTIFACT_DIR/source.txt"
          test "$actual_sha" = "$SOURCE_SHA"
          test "$actual_dockerfile_blob" = "$DOCKERFILE_BLOB"

      - name: Record runner, resources, Docker, and Buildx
        run: |
          set -euo pipefail
          builder_info="$(docker buildx inspect default)"
          {
            printf 'runner_name=%s\nrunner_os=%s\nrunner_arch=%s\n' "$RUNNER_NAME" "$RUNNER_OS" "$RUNNER_ARCH"
            printf 'runner_image_os=%s\nrunner_image_version=%s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
            cat /etc/os-release
            uname -a
            printf '\nCPU count\n'
            nproc
            printf '\nMemory\n'
            free -h
            printf '\nFilesystem\n'
            df -h / "$RUNNER_TEMP"
            printf '\nDocker version\n'
            docker version
            printf '\nBuildx version\n'
            docker buildx version
            printf '\nBuildx default builder\n'
            printf '%s\n' "$builder_info"
            printf '\nDocker storage\n'
            docker system df
            printf '\njq version\n'
            jq --version
          } 2>&1 | tee "$ARTIFACT_DIR/runner-environment.txt"
          if ! printf '%s\n' "$builder_info" | awk '
            /^[[:space:]]*Driver[[:space:]]*:/ {
              count++
              sub(/^[^:]*:[[:space:]]*/, "")
              sub(/[[:space:]]+$/, "")
              driver = $0
            }
            END { exit !(count == 1 && driver == "docker") }
          '; then
            echo "::error::Expected exactly one Buildx driver named docker."
            exit 1
          fi

      - name: Pull and record pre-pull base image digests
        working-directory: source
        run: |
          set -euo pipefail
          {
            docker pull --platform linux/amd64 "$NODE_BASE"
            docker pull --platform linux/amd64 "$UV_BASE"
          } 2>&1 | tee "$ARTIFACT_DIR/base-image-pulls.log"
          node_base_digest="$(docker image inspect "$NODE_BASE" --format '{{json .RepoDigests}}' | jq -r 'map(select(test("(^|/)node@"))) | first // empty')"
          uv_base_digest="$(docker image inspect "$UV_BASE" --format '{{json .RepoDigests}}' | jq -r 'map(select(test("(^|/)uv@"))) | first // empty')"
          test -n "$node_base_digest"
          test -n "$uv_base_digest"
          printf 'node_pre_pull=%s\nuv_pre_pull=%s\n' "$node_base_digest" "$uv_base_digest" | tee "$ARTIFACT_DIR/base-image-prepull-digests.txt"

      - name: Map pre-pull indexes to linux/amd64 manifests
        working-directory: source
        run: |
          set -euo pipefail
          map_platform_manifest() {
            local image_name="$1"
            local image_ref="$2"
            local index_file="$ARTIFACT_DIR/${image_name}-registry-index.json"
            local manifest_file="$ARTIFACT_DIR/${image_name}-registry-amd64-manifest.json"
            local manifest_digest

            docker buildx imagetools inspect --raw "$image_ref" > "$index_file"
            manifest_digest="$(node - "$index_file" <<'NODE'
          const fs = require('node:fs');
          const index = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (!['application/vnd.oci.image.index.v1+json', 'application/vnd.docker.distribution.manifest.list.v2+json'].includes(index.mediaType)) {
            throw new Error(`Expected a multi-platform image index, got mediaType=${index.mediaType ?? 'missing'}`);
          }
          const matches = (index.manifests ?? []).filter((entry) =>
            entry.platform?.os === 'linux' && entry.platform?.architecture === 'amd64'
          );
          if (matches.length !== 1 || !/^sha256:[a-f0-9]{64}$/.test(matches[0]?.digest ?? '')) {
            throw new Error(`Expected exactly one linux/amd64 manifest in index, found ${matches.length}`);
          }
          process.stdout.write(`${matches[0].digest}\n`);
          NODE
          )"

            docker buildx imagetools inspect --raw "${image_ref%@*}@${manifest_digest}" > "$manifest_file"
            node - "$manifest_file" <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (!['application/vnd.oci.image.manifest.v1+json', 'application/vnd.docker.distribution.manifest.v2+json'].includes(manifest.mediaType)) {
            throw new Error(`Expected an image manifest for the linux/amd64 child, got mediaType=${manifest.mediaType ?? 'missing'}`);
          }
          NODE
            printf '%s_index=%s\n%s_linux_amd64_manifest=%s\n' \
              "$image_name" "$image_ref" "$image_name" "$manifest_digest" \
              | tee -a "$ARTIFACT_DIR/base-image-registry-platform-digests.txt"
          }

          : > "$ARTIFACT_DIR/base-image-registry-platform-digests.txt"
          node_ref="$(awk -F= '$1 == "node_pre_pull" { print $2 }' "$ARTIFACT_DIR/base-image-prepull-digests.txt")"
          uv_ref="$(awk -F= '$1 == "uv_pre_pull" { print $2 }' "$ARTIFACT_DIR/base-image-prepull-digests.txt")"
          test -n "$node_ref"
          test -n "$uv_ref"
          map_platform_manifest node "$node_ref"
          map_platform_manifest uv "$uv_ref"

      - name: Build original Agent image
        working-directory: source
        env:
          BUILDX_METADATA_PROVENANCE: max
        run: |
          set -uo pipefail
          set +e
          docker buildx build \
            --builder default \
            --platform linux/amd64 \
            --pull \
            --no-cache \
            --progress=plain \
            --file container/Dockerfile \
            --tag "$IMAGE_REF" \
            --load \
            --metadata-file "$ARTIFACT_DIR/build-metadata.json" \
            --build-arg "TOOL_REFRESH=$SOURCE_SHA" \
            --label "org.opencontainers.image.revision=$SOURCE_SHA" \
            --label "org.opencontainers.image.source=$IMAGE_SOURCE" \
            container 2>&1 | tee "$ARTIFACT_DIR/build.log"
          build_exit_code=${PIPESTATUS[0]}
          printf '%s\n' "$build_exit_code" | tee "$ARTIFACT_DIR/build-exit-code.txt"
          printf 'Build exit code: `%s`\n' "$build_exit_code" >> "$GITHUB_STEP_SUMMARY"
          exit "$build_exit_code"

      - name: Verify builder-resolved base image digests
        working-directory: source
        run: |
          set -euo pipefail
          node - \
            "$ARTIFACT_DIR/build-metadata.json" \
            "$ARTIFACT_DIR/base-image-prepull-digests.txt" \
            "$ARTIFACT_DIR/base-image-registry-platform-digests.txt" \
            "$ARTIFACT_DIR/base-image-build-resolution.txt" <<'NODE'
          const fs = require('node:fs');
          const [metadataPath, prepullPath, mappingPath, resultPath] = process.argv.slice(2);
          const fail = (message) => {
            console.error(`Base image provenance verification failed: ${message}`);
            process.exitCode = 1;
          };
          const readPairs = (path) => Object.fromEntries(fs.readFileSync(path, 'utf8')
            .split(/\r?\n/).filter(Boolean).map((line) => {
              const separator = line.indexOf('=');
              if (separator < 1) throw new Error(`Malformed key/value record in ${path}: ${line}`);
              return [line.slice(0, separator), line.slice(separator + 1)];
            }));
          const metadata = JSON.parse(fs.readFileSync(metadataPath, 'utf8'));
          const provenance = metadata['buildx.build.provenance'];
          if (!provenance || typeof provenance !== 'object') {
            throw new Error('Buildx metadata is missing buildx.build.provenance');
          }
          const prepull = readPairs(prepullPath);
          const mapping = readPairs(mappingPath);
          const llbSources = (provenance.buildConfig?.llbDefinition ?? [])
            .map((entry) => entry?.op?.Op?.source)
            .filter((source) => source?.identifier?.startsWith('docker-image://'));
          const materials = provenance.materials ?? [];
          const specs = [
            { name: 'node', refKey: 'node_pre_pull', sourcePattern: /(?:^|\/)node(?::|@)/, purlPattern: /^pkg:docker\/(?:[^/]+\/)*node@/ },
            { name: 'uv', refKey: 'uv_pre_pull', sourcePattern: /(?:^|\/)astral-sh\/uv(?::|@)/, purlPattern: /^pkg:docker\/(?:[^/]+\/)*astral-sh\/uv@/ },
          ];
          const lines = [];
          for (const spec of specs) {
            const source = llbSources.find((entry) => spec.sourcePattern.test(entry.identifier));
            const resolveMode = source?.attrs?.['image.resolvemode'];
            if (!source || !resolveMode || resolveMode === 'local') {
              fail(`${spec.name}: expected --pull/remote resolution in LLB; source=${source?.identifier ?? 'missing'}, image.resolvemode=${resolveMode ?? 'missing'}`);
            }
            if (!source) {
              continue;
            }

            const materialMatches = materials.filter((entry) => {
              if (typeof entry?.uri !== 'string' || !spec.purlPattern.test(entry.uri)) return false;
              const query = entry.uri.split('?')[1] ?? '';
              return new URLSearchParams(query).get('platform') === 'linux/amd64';
            });
            const digests = [...new Set(materialMatches.map((entry) => entry?.digest?.sha256).filter(Boolean))];
            const indexRef = prepull[spec.refKey];
            const mappedIndexRef = mapping[`${spec.name}_index`];
            const platformManifest = mapping[`${spec.name}_linux_amd64_manifest`];
            const indexDigest = indexRef?.match(/@sha256:([a-f0-9]{64})$/)?.[1];
            if (materialMatches.length !== 1 || digests.length !== 1 || !indexDigest || mappedIndexRef !== indexRef || !/^sha256:[a-f0-9]{64}$/.test(platformManifest ?? '')) {
              fail(`${spec.name}: expected one linux/amd64 provenance material and a Registry mapping for the same pre-pull index; material_count=${materialMatches.length}, distinct_digests=${digests.length}, prepull_index=${indexRef ?? 'missing'}, mapped_index=${mappedIndexRef ?? 'missing'}, platform_manifest=${platformManifest ?? 'missing'}`);
              continue;
            }

            const actual = digests[0];
            const allowedRegistryDigests = new Set([indexDigest, platformManifest.slice('sha256:'.length)]);
            const matchedLevel = actual === indexDigest ? 'multiarch_index' : actual === platformManifest.slice('sha256:'.length) ? 'linux_amd64_manifest' : undefined;
            console.log(`${spec.name}: source=${source.identifier}; image.resolvemode=${resolveMode ?? 'missing'}; provenance_purl=${materialMatches[0].uri}`);
            console.log(`${spec.name}: buildkit_digest=sha256:${actual}; prepull_index=${indexRef}; registry_linux_amd64_manifest=${platformManifest}`);
            if (!allowedRegistryDigests.has(actual)) {
              fail(`${spec.name}: BuildKit digest sha256:${actual} matches neither the captured Registry index sha256:${indexDigest} nor its mapped linux/amd64 manifest ${platformManifest}`);
              continue;
            }
            lines.push(`${spec.name}_prepull_index=${indexRef}`);
            lines.push(`${spec.name}_registry_linux_amd64_manifest=${platformManifest}`);
            lines.push(`${spec.name}_buildkit_resolved=sha256:${actual}`);
            lines.push(`${spec.name}_matched_digest_level=${matchedLevel}`);
          }
          if (process.exitCode) process.exit(process.exitCode);
          fs.writeFileSync(resultPath, `${lines.join('\n')}\n`);
          console.log(`Base image provenance verification passed for ${specs.length} pinned linux/amd64 Registry mappings.`);
          NODE

      - name: Record built image metadata and tool versions
        working-directory: source
        run: |
          set -euo pipefail
          docker image inspect "$IMAGE_REF" | jq '.[0] | {Id, Os, Architecture, RepoDigests, Labels: .Config.Labels}' > "$ARTIFACT_DIR/image-metadata.json"
          docker run --rm --entrypoint /bin/cat "$IMAGE_REF" /usr/local/share/miniclaw-tool-versions.txt | tee "$ARTIFACT_DIR/tool-versions.txt"
          {
            printf 'source_sha=%s\n' "$SOURCE_SHA"
            printf 'dockerfile_blob=%s\n' "$DOCKERFILE_BLOB"
            printf 'target_platform=linux/amd64\n'
            printf 'image_ref=%s\n' "$IMAGE_REF"
            printf 'image_id=%s\n' "$(docker image inspect "$IMAGE_REF" --format '{{.Id}}')"
            printf 'architecture=%s\n' "$(docker image inspect "$IMAGE_REF" --format '{{.Architecture}}')"
            printf 'oci_revision=%s\n' "$(docker image inspect "$IMAGE_REF" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
            printf 'oci_source=%s\n' "$(docker image inspect "$IMAGE_REF" --format '{{index .Config.Labels "org.opencontainers.image.source"}}')"
            printf 'registry_repo_digest=unavailable_not_pushed\n'
            cat "$ARTIFACT_DIR/base-image-prepull-digests.txt"
            cat "$ARTIFACT_DIR/base-image-registry-platform-digests.txt"
            cat "$ARTIFACT_DIR/base-image-build-resolution.txt"
          } | tee "$ARTIFACT_DIR/build-report.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Run original container Smoke Test
        working-directory: source
        run: |
          set -uo pipefail
          set +e
          bash scripts/smoke-agent-image.sh "$IMAGE_REF" amd64 2>&1 | tee "$ARTIFACT_DIR/smoke.log"
          smoke_exit_code=${PIPESTATUS[0]}
          printf '%s\n' "$smoke_exit_code" | tee "$ARTIFACT_DIR/smoke-exit-code.txt"
          printf 'Smoke exit code: `%s`\n' "$smoke_exit_code" >> "$GITHUB_STEP_SUMMARY"
          exit "$smoke_exit_code"

      - name: Export compressed image after Smoke Test
        working-directory: source
        run: |
          set -euo pipefail
          archive_tmp="$RUNNER_TEMP/miniclaw-agent-00f-linux-amd64.tar.gz.partial"
          docker save "$IMAGE_REF" | gzip -1 > "$archive_tmp"
          mv "$archive_tmp" "$IMAGE_ARTIFACT_DIR/miniclaw-agent-00f-linux-amd64.tar.gz"
          (
            cd "$IMAGE_ARTIFACT_DIR"
            sha256sum miniclaw-agent-00f-linux-amd64.tar.gz | tee miniclaw-agent-00f-linux-amd64.tar.gz.sha256
          )
          archive_sha256="$(cut -d ' ' -f1 "$IMAGE_ARTIFACT_DIR/miniclaw-agent-00f-linux-amd64.tar.gz.sha256")"
          printf 'archive_sha256=%s\n' "$archive_sha256" | tee -a "$ARTIFACT_DIR/build-report.txt" >> "$GITHUB_STEP_SUMMARY"
          stat --printf='compressed_image_bytes=%s\n' "$IMAGE_ARTIFACT_DIR/miniclaw-agent-00f-linux-amd64.tar.gz" | tee "$ARTIFACT_DIR/compressed-image-size.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload approved image Artifact after Smoke and export
        if: ${{ success() && inputs.confirm_artifact_storage_and_public_boundary }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: retailops-miniclaw-agent-00f-linux-amd64-a7118531-run-${{ github.run_id }}
          path: /tmp/retailops-agent-image/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Upload diagnostic evidence Artifact
        if: ${{ always() && inputs.confirm_artifact_storage_and_public_boundary }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: retailops-miniclaw-agent-00f-diagnostics-a7118531-run-${{ github.run_id }}
          path: /tmp/retailops-agent-diagnostics/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
